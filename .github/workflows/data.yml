name: Update NASA data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the last 7 days from DONKI
        run: node scripts/fetch-donki.mjs --latest
      - name: Commit data/latest.json if it changed
        run: |
          if git diff --quiet -- data/latest.json; then
            echo "No change in data/latest.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git commit -m "Update the saved flare list"
          git push
